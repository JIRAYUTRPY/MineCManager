services:
  panel:
    build:
      context: .
      dockerfile: Dockerfile.panel
    environment:
      MCM_PANEL_DEPLOYMENT: compose
    restart: unless-stopped
    ports:
      - "127.0.0.1:9080:9080"
    volumes:
      - panel-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
volumes:
  panel-data:
