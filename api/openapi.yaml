              $ref: '#/components/schemas/KeyCreate'
  /v1/keys/{keyId}:
    delete:
      summary: Revoke API key; last active key administrator protected
      operationId: delete__v1_keys_keyId
      x-required-scope: admin:keys
      responses:
        '200':
          description: Success
        '400':
          description: Invalid request
        '403':
          description: Missing, revoked, expired, insufficient or node-restricted
            key
        '404':
          description: Resource not found
        '409':
          description: Service not stopped or operation conflicts
        '412':
          description: Current SHA-256 precondition failed
        '413':
          description: Request size limit exceeded
        '500':
          description: Operation failed; inspect state before retry
        '502':
          description: Agent unavailable or unknown operation outcome
        '503':
          description: Audit or persistence unavailable; operation may have completed
            if result persistence failed
      parameters:
      - name: keyId
        in: path
        required: true
        schema: *id001
  /v1/audit:
    get:
      summary: Read local audit records using line offsets
      operationId: get__v1_audit
      x-required-scope: audit:read
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  records:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEvent'
                  next_offset:
                    type: integer
        '400':
          description: Invalid request
        '403':
          description: Missing, revoked, expired, insufficient or node-restricted
            key
        '404':
          description: Resource not found
        '409':
          description: Service not stopped or operation conflicts
        '412':
          description: Current SHA-256 precondition failed
        '413':
          description: Request size limit exceeded
        '500':
          description: Operation failed; inspect state before retry
        '502':
          description: Agent unavailable or unknown operation outcome
        '503':
          description: Audit or persistence unavailable; operation may have completed
            if result persistence failed
      parameters:
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
  /v1/nodes/{nodeId}/paper/players:
    get:
      summary: List online Paper player UUIDs and names
      operationId: get__v1_nodes_nodeId_paper_players
      x-required-scope: players:read
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    uuid: *id001
                    name: *id001
        '400':
          description: Invalid request
        '403':
          description: Missing, revoked, expired, insufficient or node-restricted
            key
        '404':
          description: Resource not found
        '409':
          description: Service not stopped or operation conflicts
