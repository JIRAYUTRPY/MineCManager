openapi: 3.0.3
info:
  title: MineCManager VM Control Plane
  version: 0.2.0
  description: Panel API. Service keys support scopes and optional node restrictions. Human sessions use role scopes. All cookie-authenticated mutations require same origin and the X-MCM-Request header with value "1". Mutations
    require durable audit intent. Agent shares the node suffix routes and uses its
    separate bearer token; remote agents require mTLS. Unknown mutation outcomes must
    be inspected before retry.
servers:
- url: http://127.0.0.1:9080
security:
- bearerAuth: []
- panelSession: []
paths:
  /v1/nodes:
    get:
      summary: List nodes visible to this key
      operationId: get__v1_nodes
      x-required-scope: nodes:read
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: &id001
                      type: string
        '400':
          description: Invalid request
        '403':
          description: Missing, revoked, expired, insufficient or node-restricted
            key
        '404':
          description: Resource not found
        '409':
          description: Service not stopped or operation conflicts
        '412':
          description: Current SHA-256 precondition failed
        '413':
          description: Request size limit exceeded
        '500':
          description: Operation failed; inspect state before retry
        '502':
          description: Agent unavailable or unknown operation outcome
        '503':
          description: Audit or persistence unavailable; operation may have completed
            if result persistence failed
    post:
      summary: Persist node registration; provision token environment first
      operationId: post__v1_nodes
      x-required-scope: admin:nodes
      responses:
        '201':
          description: Success
        '400':
          description: Invalid request
        '403':
          description: Missing, revoked, expired, insufficient or node-restricted
            key
        '404':
          description: Resource not found
        '409':
          description: Service not stopped or operation conflicts
        '412':
          description: Current SHA-256 precondition failed
        '413':
          description: Request size limit exceeded
        '500':
          description: Operation failed; inspect state before retry
        '502':
          description: Agent unavailable or unknown operation outcome
        '503':
          description: Audit or persistence unavailable; operation may have completed
            if result persistence failed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Node'
  /v1/registrations/{nodeId}:
    delete:
      summary: Remove node registration
      operationId: delete__v1_registrations_nodeId
      x-required-scope: admin:nodes
      responses:
        '200':
          description: Success
        '400':
          description: Invalid request
        '403':
          description: Missing, revoked, expired, insufficient or node-restricted
            key
        '404':
          description: Resource not found
        '409':
          description: Service not stopped or operation conflicts
        '412':
          description: Current SHA-256 precondition failed
        '413':
          description: Request size limit exceeded
        '500':
          description: Operation failed; inspect state before retry
        '502':
          description: Agent unavailable or unknown operation outcome
        '503':
          description: Audit or persistence unavailable; operation may have completed
            if result persistence failed
      parameters:
      - name: nodeId
        in: path
        required: true
        schema: *id001
  /v1/nodes/{nodeId}/status:
    get:
      summary: Read live service state
      operationId: get__v1_nodes_nodeId_status
      x-required-scope: nodes:read
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: *id001
        '400':
          description: Invalid request
        '403':
          description: Missing, revoked, expired, insufficient or node-restricted
            key
        '404':
          description: Resource not found
        '409':
          description: Service not stopped or operation conflicts
        '412':
          description: Current SHA-256 precondition failed
        '413':
          description: Request size limit exceeded
        '500':
          description: Operation failed; inspect state before retry
        '502':
          description: Agent unavailable or unknown operation outcome
        '503':
          description: Audit or persistence unavailable; operation may have completed
            if result persistence failed
      parameters:
      - name: nodeId
        in: path
        required: true
        schema: *id001
  /v1/nodes/{nodeId}/metrics:
    get:
      summary: Read host disk/load and agent runtime metrics
      operationId: get__v1_nodes_nodeId_metrics
      x-required-scope: nodes:read
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  observed_at: *id001
                  uptime_seconds:
                    type: number
                  logical_cpus:
                    type: integer
                  loadavg: *id001
                  disk_available_bytes:
                    type: integer
                  disk_total_bytes:
                    type: integer
                  agent_heap_bytes:
                    type: integer
        '400':
          description: Invalid request
        '403':
          description: Missing, revoked, expired, insufficient or node-restricted
            key
        '404':
          description: Resource not found
        '409':
          description: Service not stopped or operation conflicts
        '412':
          description: Current SHA-256 precondition failed
        '413':
          description: Request size limit exceeded
        '500':
          description: Operation failed; inspect state before retry
        '502':
          description: Agent unavailable or unknown operation outcome
        '503':
          description: Audit or persistence unavailable; operation may have completed
            if result persistence failed
      parameters:
      - name: nodeId
        in: path
        required: true
        schema: *id001
  /v1/nodes/{nodeId}/files:
    get:
      summary: List server directory entries
      operationId: get__v1_nodes_nodeId_files
      x-required-scope: nodes:read
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name: *id001
                    directory:
                      type: boolean
        '400':
          description: Invalid request
        '403':
          description: Missing, revoked, expired, insufficient or node-restricted
            key
        '404':
          description: Resource not found
        '409':
          description: Service not stopped or operation conflicts
        '412':
          description: Current SHA-256 precondition failed
        '413':
          description: Request size limit exceeded
        '500':
          description: Operation failed; inspect state before retry
        '502':
          description: Agent unavailable or unknown operation outcome
        '503':
          description: Audit or persistence unavailable; operation may have completed
            if result persistence failed
      parameters:
      - name: nodeId
        in: path
        required: true
        schema: *id001
      - name: path
        in: query
        required: false
        schema: *id001
  /v1/nodes/{nodeId}/actions:
    post:
      summary: Start, stop or restart the fixed systemd unit
      operationId: post__v1_nodes_nodeId_actions
      x-required-scope: nodes:control
      responses:
        '204':
          description: Success
        '400':
          description: Invalid request
        '403':
          description: Missing, revoked, expired, insufficient or node-restricted
            key
        '404':
          description: Resource not found
        '409':
          description: Service not stopped or operation conflicts
        '412':
          description: Current SHA-256 precondition failed
        '413':
          description: Request size limit exceeded
        '500':
          description: Operation failed; inspect state before retry
        '502':
          description: Agent unavailable or unknown operation outcome
        '503':
          description: Audit or persistence unavailable; operation may have completed
            if result persistence failed
      parameters:
      - name: nodeId
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum:
                  - start
                  - stop
                  - restart
              required:
              - action
  /v1/nodes/{nodeId}/plugins:
    get:
      summary: List installed JAR metadata
      operationId: get__v1_nodes_nodeId_plugins
      x-required-scope: plugins:read
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plugin'
        '400':
          description: Invalid request
        '403':
          description: Missing, revoked, expired, insufficient or node-restricted
            key
        '404':
          description: Resource not found
        '409':
          description: Service not stopped or operation conflicts
        '412':
          description: Current SHA-256 precondition failed
        '413':
          description: Request size limit exceeded
        '500':
          description: Operation failed; inspect state before retry
        '502':
          description: Agent unavailable or unknown operation outcome
        '503':
          description: Audit or persistence unavailable; operation may have completed
            if result persistence failed
      parameters:
      - name: nodeId
        in: path
        required: true
        schema: *id001
  /v1/nodes/{nodeId}/plugins/{filename}:
    get:
      summary: Read current plugin metadata and saved version hashes
      operationId: get__v1_nodes_nodeId_plugins_filename
      x-required-scope: plugins:read
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginDetail'
        '400':
          description: Invalid request
        '403':
          description: Missing, revoked, expired, insufficient or node-restricted
            key
        '404':
          description: Resource not found
        '409':
          description: Service not stopped or operation conflicts
        '412':
          description: Current SHA-256 precondition failed
        '413':
          description: Request size limit exceeded
        '500':
          description: Operation failed; inspect state before retry
        '502':
          description: Agent unavailable or unknown operation outcome
        '503':
          description: Audit or persistence unavailable; operation may have completed
            if result persistence failed
      parameters:
      - name: nodeId
        in: path
        required: true
        schema: *id001
      - name: filename
        in: path
        required: true
        schema: *id001
    put:
      summary: Validate and install or replace JAR while service is inactive (maximum
        16 MiB)
      operationId: put__v1_nodes_nodeId_plugins_filename
      x-required-scope: plugins:write
      responses:
        '200':
          description: Success
        '400':
          description: Invalid request
        '403':
          description: Missing, revoked, expired, insufficient or node-restricted
            key
        '404':
          description: Resource not found
        '409':
          description: Service not stopped or operation conflicts
        '412':
          description: Current SHA-256 precondition failed
        '413':
          description: Request size limit exceeded
        '500':
          description: Operation failed; inspect state before retry
        '502':
          description: Agent unavailable or unknown operation outcome
        '503':
          description: Audit or persistence unavailable; operation may have completed
            if result persistence failed
        '201':
          description: New plugin installed
      parameters:
      - name: nodeId
        in: path
        required: true
        schema: *id001
      - name: filename
        in: path
        required: true
        schema: *id001
      - name: If-Match
        in: header
        required: false
        schema: *id001
        description: Quoted current SHA-256, mandatory when target exists.
      requestBody:
        required: true
        content:
          application/java-archive:
            schema:
              type: string
              format: binary
    post:
      summary: Restore a saved plugin version while inactive
      operationId: post__v1_nodes_nodeId_plugins_filename
      x-required-scope: plugins:write
      responses:
        '200':
          description: Success
        '400':
          description: Invalid request
        '403':
          description: Missing, revoked, expired, insufficient or node-restricted
            key
        '404':
          description: Resource not found
        '409':
          description: Service not stopped or operation conflicts
        '412':
          description: Current SHA-256 precondition failed
        '413':
          description: Request size limit exceeded
        '500':
          description: Operation failed; inspect state before retry
        '502':
          description: Agent unavailable or unknown operation outcome
        '503':
          description: Audit or persistence unavailable; operation may have completed
            if result persistence failed
        '201':
          description: Deleted plugin restored
      parameters:
      - name: nodeId
        in: path
        required: true
        schema: *id001
      - name: filename
        in: path
        required: true
        schema: *id001
      - name: If-Match
        in: header
        required: false
        schema: *id001
        description: Quoted current SHA-256, mandatory when target exists.
      - name: If-None-Match
        in: header
        required: false
        schema: *id001
        description: Use * when restoring a deleted plugin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Version'
    delete:
      summary: Save version then delete plugin while inactive
      operationId: delete__v1_nodes_nodeId_plugins_filename
      x-required-scope: plugins:write
      responses:
        '204':
          description: Success
        '400':
          description: Invalid request
        '403':
          description: Missing, revoked, expired, insufficient or node-restricted
            key
        '404':
          description: Resource not found
        '409':
          description: Service not stopped or operation conflicts
        '412':
          description: Current SHA-256 precondition failed
        '413':
          description: Request size limit exceeded
        '500':
          description: Operation failed; inspect state before retry
        '502':
          description: Agent unavailable or unknown operation outcome
        '503':
          description: Audit or persistence unavailable; operation may have completed
            if result persistence failed
      parameters:
      - name: nodeId
        in: path
        required: true
        schema: *id001
      - name: filename
        in: path
        required: true
        schema: *id001
      - name: If-Match
        in: header
        required: true
        schema: *id001
        description: Quoted current SHA-256.
  /v1/nodes/{nodeId}/config:
    get:
      summary: Read UTF-8 configuration and version hashes
      operationId: get__v1_nodes_nodeId_config
      x-required-scope: configs:read
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'
        '400':
          description: Invalid request
        '403':
          description: Missing, revoked, expired, insufficient or node-restricted
            key
        '404':
          description: Resource not found
        '409':
          description: Service not stopped or operation conflicts
        '412':
          description: Current SHA-256 precondition failed
        '413':
          description: Request size limit exceeded
        '500':
          description: Operation failed; inspect state before retry
        '502':
          description: Agent unavailable or unknown operation outcome
        '503':
          description: Audit or persistence unavailable; operation may have completed
            if result persistence failed
      parameters:
      - name: nodeId
        in: path
        required: true
        schema: *id001
      - &id002
        name: path
        in: query
        required: true
        schema: *id001
    put:
      summary: Validate and save existing config while inactive (maximum 1 MiB)
      operationId: put__v1_nodes_nodeId_config
      x-required-scope: configs:write
      responses:
        '200':
          description: Success
        '400':
          description: Invalid request
        '403':
          description: Missing, revoked, expired, insufficient or node-restricted
            key
        '404':
          description: Resource not found
        '409':
          description: Service not stopped or operation conflicts
        '412':
          description: Current SHA-256 precondition failed
        '413':
          description: Request size limit exceeded
        '500':
          description: Operation failed; inspect state before retry
        '502':
          description: Agent unavailable or unknown operation outcome
        '503':
          description: Audit or persistence unavailable; operation may have completed
            if result persistence failed
      parameters:
      - name: nodeId
        in: path
        required: true
        schema: *id001
      - name: If-Match
        in: header
        required: true
        schema: *id001
        description: Quoted current SHA-256.
      - *id002
      requestBody:
        required: true
        content:
          text/plain:
            schema: *id001
    post:
      summary: Restore config version while inactive
      operationId: post__v1_nodes_nodeId_config
      x-required-scope: configs:write
      responses:
        '200':
          description: Success
        '400':
          description: Invalid request
        '403':
          description: Missing, revoked, expired, insufficient or node-restricted
            key
        '404':
          description: Resource not found
        '409':
          description: Service not stopped or operation conflicts
        '412':
          description: Current SHA-256 precondition failed
        '413':
          description: Request size limit exceeded
        '500':
          description: Operation failed; inspect state before retry
        '502':
          description: Agent unavailable or unknown operation outcome
        '503':
          description: Audit or persistence unavailable; operation may have completed
            if result persistence failed
      parameters:
      - name: nodeId
        in: path
        required: true
        schema: *id001
      - name: If-Match
        in: header
        required: true
        schema: *id001
        description: Quoted current SHA-256.
      - *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Version'
  /v1/nodes/{nodeId}/backup/manifest:
    get:
      summary: Read legacy selected-path discovery manifest; not a backup
      operationId: get__v1_nodes_nodeId_backup_manifest
      x-required-scope: backups:read
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      $ref: '#/components/schemas/File'
                  skipped:
                    type: array
                    items: *id001
        '400':
          description: Invalid request
        '403':
          description: Missing, revoked, expired, insufficient or node-restricted
            key
        '404':
          description: Resource not found
        '409':
          description: Service not stopped or operation conflicts
        '412':
          description: Current SHA-256 precondition failed
        '413':
          description: Request size limit exceeded
        '500':
          description: Operation failed; inspect state before retry
        '502':
          description: Agent unavailable or unknown operation outcome
        '503':
          description: Audit or persistence unavailable; operation may have completed
