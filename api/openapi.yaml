components:
  securitySchemes:
    panelSession: {type: apiKey, in: cookie, name: mcm_session}
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    PanelRequest:
      in: header
      name: X-MCM-Request
      required: true
      schema: {type: string, enum: ["1"]}
  schemas:
    PanelUsername:
      type: string
      minLength: 2
      maxLength: 40
      pattern: ^[A-Za-z][A-Za-z0-9_-]{1,39}$
    PanelPassword:
      type: string
      format: password
      minLength: 12
      description: At most 256 UTF-8 bytes.
    PanelRole:
      type: string
      pattern: ^[a-z][a-z0-9_-]{1,39}$
    PanelScopes:
      type: array
      items:
        type: string
    PanelLogin:
      type: object
      properties:
        username:
          $ref: '#/components/schemas/PanelUsername'
        password:
          $ref: '#/components/schemas/PanelPassword'
      additionalProperties: false
      required:
      - username
      - password
    PanelBootstrap:
      type: object
      properties:
        username:
          $ref: '#/components/schemas/PanelUsername'
        password:
          $ref: '#/components/schemas/PanelPassword'
        admin_key:
          type: string
          format: password
      additionalProperties: false
      required:
      - username
      - password
      - admin_key
    PanelPasswordChange:
      type: object
      properties:
        current_password:
          type: string
          format: password
        new_password:
          $ref: '#/components/schemas/PanelPassword'
      additionalProperties: false
      required:
      - current_password
      - new_password
    PanelAccount:
      type: object
      properties:
        username:
          $ref: '#/components/schemas/PanelUsername'
        role:
          $ref: '#/components/schemas/PanelRole'
        scopes:
          $ref: '#/components/schemas/PanelScopes'
        enabled:
          type: boolean
      additionalProperties: false
      required:
      - username
      - role
      - enabled
    PanelRoleDefinition:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/PanelRole'
        scopes:
          $ref: '#/components/schemas/PanelScopes'
        builtin:
          type: boolean
      additionalProperties: false
      required:
      - name
      - scopes
      - builtin
    PanelRoleInput:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/PanelRole'
        scopes:
          $ref: '#/components/schemas/PanelScopes'
      additionalProperties: false
      required:
      - name
      - scopes
    PanelRoleUpdate:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/PanelRole'
        scopes:
          $ref: '#/components/schemas/PanelScopes'
      additionalProperties: false
      required:
      - scopes
    PanelNewUser:
      type: object
      properties:
        username:
          $ref: '#/components/schemas/PanelUsername'
        password:
          $ref: '#/components/schemas/PanelPassword'
        role:
          $ref: '#/components/schemas/PanelRole'
      additionalProperties: false
      required:
      - username
      - password
      - role
    PanelUserChange:
      type: object
      properties:
        password:
          $ref: '#/components/schemas/PanelPassword'
        role:
          $ref: '#/components/schemas/PanelRole'
        enabled:
          type: boolean
      additionalProperties: false
      minProperties: 1
    PanelPreferences:
      type: object
      additionalProperties:
        type: string
      description: Allowed selection fields are defined per page. PUT merges the supplied fields for the current
        account.
    PanelSaved:
      type: object
      properties:
        saved:
          type: boolean
      additionalProperties: false
      required:
      - saved
    Plugin:
      type: object
      properties:
        name: *id001
        size:
          type: integer
        sha256: *id001
      required:
      - name
      - size
      - sha256
    PluginDetail:
      type: object
      properties:
        plugin:
          allOf:
          - $ref: '#/components/schemas/Plugin'
          nullable: true
        versions:
          type: array
          items: *id001
    Config:
      type: object
      properties:
        path: *id001
        content: *id001
        sha256: *id001
        versions:
          type: array
          items: *id001
    Version:
      type: object
      properties:
        version:
          type: string
          pattern: ^[a-f0-9]{64}$
      required:
      - version
    File:
      type: object
      properties:
        path: *id001
        size:
          type: integer
        sha256: *id001
    Backup:
      type: object
      properties:
        id: *id001
        created:
          type: string
          format: date-time
        files:
          type: array
          items:
            $ref: '#/components/schemas/File'
    Node:
      type: object
      properties:
        id: *id001
        url:
          type: string
          format: uri
        token_env: *id001
      required:
      - id
      - url
      - token_env
    KeyCreate:
      type: object
      properties:
        id: *id001
        token:
          type: string
          minLength: 32
          description: Optional custom secret; omitted means cryptographically generated.
        scopes:
          type: array
          items: *id001
        nodes:
          type: array
          items: *id001
        expires_at:
          type: string
          format: date-time
      required:
      - id
      - scopes
    Key:
      type: object
      properties:
        id: *id001
        scopes:
          type: array
          items: *id001
        nodes:
          type: array
          items: *id001
        expires_at:
          type: string
          format: date-time
          nullable: true
        revoked:
          type: boolean
    AuditEvent:
      type: object
      properties:
        at:
          type: string
          format: date-time
        request_id: *id001
        phase: *id001
        key_id: *id001
        node_id: *id001
        action: *id001
        status:
          type: integer
