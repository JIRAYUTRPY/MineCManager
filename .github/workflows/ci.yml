name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
      - run: python3 scripts/smoke-test.py
      - run: test -z "$(gofmt -l cmd internal)"
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: MCM_UI_TEST=1 python3 scripts/smoke-test.py
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: paper-bridge/pom.xml
      - run: mvn -B -ntp -f paper-bridge/pom.xml verify
      - uses: actions/upload-artifact@v4
        with:
          name: mcm-paper-bridge
          path: paper-bridge/target/mcm-paper-bridge-0.2.0.jar
